name: Docker PR12 verification only
on:
  push:
    branches: [verify/docker-pr12]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Record native execution environment
        run: |
          uname -m
          docker version
          docker compose version
      - name: Build actual Dockerfile without publishing
        run: docker buildx build --platform linux/${{ matrix.arch }} --load --build-arg AC_BUILD_VERSION=4.7.0 -t archive-center:pr12 .
      - name: Exercise Compose and persistent data
        env:
          AC_TEST_ARCH: ${{ matrix.arch }}
        run: python3 scripts/docker-pr12-smoke.py
